<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>STICKMAN IMMORTAL: TOÀN PHỦI - ĐẠI THIÊN THẾ GIỚI</title>
    <style>
        /* --- CORE DESIGN SYSTEM --- */
        :root {
            --p: #00f2ff; --hp: #ff3344; --st: #44ff66; --exp: #ffff00;
            --mp: #bc00ff; --hunger: #ffaa00; --thirst: #0099ff;
            --bg: #010103; --panel: rgba(10, 10, 15, 0.98);
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--bg); overflow: hidden; 
            font-family: 'Segoe UI', 'Roboto', sans-serif; color: #e0e0e0; 
        }

        canvas { display: block; position: absolute; z-index: 1; image-rendering: pixelated; }

        /* --- IMMORTAL HUD (THANH TRẠNG THÁI) --- */
        #main-hud {
            position: absolute; top: 25px; left: 25px; z-index: 100;
            pointer-events: none; width: 380px;
        }

        .stat-card {
            background: var(--panel); padding: 25px; border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 60px rgba(0,0,0,1); backdrop-filter: blur(20px);
        }

        .realm-title { font-size: 28px; font-weight: 900; color: var(--exp); letter-spacing: 3px; text-shadow: 0 0 15px var(--exp); }
        .sub-realm { font-size: 12px; color: var(--p); letter-spacing: 5px; margin-bottom: 15px; }

        .bar-group { margin-bottom: 12px; }
        .bar-label { display: flex; justify-content: space-between; font-size: 10px; color: #777; margin-bottom: 4px; }
        .bar-outer { width: 100%; height: 8px; background: #050505; border-radius: 4px; overflow: hidden; border: 1px solid #222; }
        .bar-inner { height: 100%; width: 100%; transition: width 0.4s cubic-bezier(0.1, 0.7, 1.0, 0.1); }
        
        #hp-fill { background: linear-gradient(90deg, #ff3344, #ff6677); box-shadow: 0 0 15px var(--hp); }
        #mp-fill { background: linear-gradient(90deg, #bc00ff, #e066ff); box-shadow: 0 0 15px var(--mp); }
        #st-fill { background: linear-gradient(90deg, #44ff66, #88ffaa); box-shadow: 0 0 15px var(--st); }
        #exp-fill { background: linear-gradient(90deg, #ffff00, #ffaa00); box-shadow: 0 0 15px var(--exp); }

        /* --- MINI-MAP SYSTEM --- */
        #minimap-wrapper {
            position: absolute; top: 25px; right: 25px;
            width: 260px; height: 260px; background: rgba(0,0,0,0.9);
            border: 2px solid #1a1a1a; border-radius: 12px; z-index: 100; overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        #mm-canvas { width: 100%; height: 100%; }
        #coord-ui { position: absolute; bottom: 10px; left: 10px; font-size: 9px; color: #555; }

        /* --- NOTIFICATION & LOGS --- */
        #log-container {
            position: fixed; bottom: 30px; left: 30px; z-index: 100;
            max-height: 200px; overflow: hidden; pointer-events: none;
        }
        .log-entry { font-family: monospace; font-size: 12px; color: #888; margin-bottom: 5px; animation: slideIn 0.3s forwards; }

        /* --- TAB MENU (INVENTORY & SKILLS) --- */
        #tab-menu {
            position: fixed; inset: 0; background: rgba(2, 2, 4, 0.98);
            z-index: 500; display: none; padding: 60px; 
            grid-template-columns: 1fr 1fr 1fr; gap: 30px; backdrop-filter: blur(40px);
        }
        .menu-pane { background: #050507; border: 1px solid #151515; border-radius: 10px; padding: 30px; }

        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

<div id="main-hud">
    <div class="stat-card">
        <div class="realm-title" id="ui-name">TOÀN PHỦI</div>
        <div class="sub-realm" id="ui-realm">LUYỆN KHÍ TẦNG 1</div>
        
        <div class="bar-group">
            <div class="bar-label"><span>SINH MỆNH (HP)</span><span id="txt-hp">1000/1000</span></div>
            <div class="bar-outer"><div id="hp-fill" class="bar-inner"></div></div>
        </div>
        <div class="bar-group">
            <div class="bar-label"><span>LINH LỰC (MP)</span><span id="txt-mp">500/500</span></div>
            <div class="bar-outer"><div id="mp-fill" class="bar-inner"></div></div>
        </div>
        <div class="bar-group">
            <div class="bar-label"><span>THỂ LỰC (ST)</span><span id="txt-st">300/300</span></div>
            <div class="bar-outer"><div id="st-fill" class="bar-inner"></div></div>
        </div>
        <div class="bar-group">
            <div class="bar-label"><span>TU VI (EXP)</span><span id="txt-exp">0%</span></div>
            <div class="bar-outer"><div id="exp-fill" class="bar-inner"></div></div>
        </div>
    </div>
</div>

<div id="minimap-wrapper">
    <canvas id="mm-canvas"></canvas>
    <div id="coord-ui">X: 25000 / Y: 25000</div>
</div>

<div id="tab-menu">
    <div class="menu-pane">
        <h2 style="color: var(--p)">TRẠNG THÁI</h2>
        <div id="status-content"></div>
    </div>
    <div class="menu-pane">
        <h2 style="color: var(--exp)">HÀNH TRANG</h2>
        <div id="inv-content"></div>
    </div>
    <div class="menu-pane">
        <h2 style="color: var(--mp)">THẦN THÔNG</h2>
        <div id="skill-content" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;"></div>
    </div>
</div>

<div id="log-container"></div>
<canvas id="gameCanvas"></canvas>
<script>
/**
 * PHẦN 2: ENGINE KIẾN TẠO THẾ GIỚI
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const mmCanvas = document.getElementById('mm-canvas');
const mmCtx = mmCanvas.getContext('2d');

const MAP_SIZE = 50000;
const FPS_LIMIT = 244;
const FRAME_TIME = 1000 / FPS_LIMIT;

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
mmCanvas.width = 260; mmCanvas.height = 260;

const player = {
    x: 25000, y: 25000, vx: 0, vy: 0,
    hp: 1000, maxHp: 1000, mp: 500, maxMp: 500, st: 300, maxSt: 300,
    exp: 0, nextExp: 100, level: 1, realmIdx: 0,
    atk: 100, def: 50, speed: 0.5, name: "TOÀN PHỦI", sect: "Tự Do",
    skills: []
};

const camera = { x: player.x, y: player.y, ease: 0.06, zoom: 1 };
const world = { sects: [], trees: [], rocks: [], mobs: [], items: [], particles: [] };
const keys = {};

// KHỞI TẠO HỆ THỐNG TÔNG MÔN & ĐỊA ĐIỂM
function initUniverse() {
    const sectConfigs = [
        { n: "Lôi Đình Phái", c: "#00f2ff", m: "Lôi điện khai tâm!" },
        { n: "Hỏa Vân Tông", c: "#ff4400", m: "Hỏa diệm trùng sinh!" },
        { n: "Kiếm Tông", c: "#ffffff", m: "Kiếm khí trường tồn!" },
        { n: "Minh Giới", c: "#7700ff", m: "U linh bất tử!" },
        { n: "Thần Mộc Tông", c: "#00ff44", m: "Vạn vật sinh sôi!" },
        { n: "Ma Giáo", c: "#bc00ff", m: "Nghịch thiên nhi hành!" },
        { n: "Thiên Đạo Tông", c: "#ffff00", m: "Chân lý vĩnh hằng!" },
        { n: "Huyết Nguyệt Giáo", c: "#ff0044", m: "Huyết sắc thanh tẩy!" },
        { n: "Sơn Thạch phái", c: "#999999", m: "Vững chãi như núi!" },
        { n: "Huyền Thủy Cung", c: "#0055ff", m: "Nhu hòa thắng cương!" }
    ];

    sectConfigs.forEach((s, i) => {
        const dist = 15000 + Math.random() * 8000;
        const ang = (i / 10) * Math.PI * 2;
        const sx = 25000 + Math.cos(ang) * dist;
        const sy = 25000 + Math.sin(ang) * dist;
        
        world.sects.push({ ...s, x: sx, y: sy });
        
        // Trưởng môn NPC
        world.mobs.push({
            x: sx, y: sy, name: `[TRƯỞNG MÔN] ${s.n}`,
            color: s.c, isNPC: true, dialog: s.m, sect: s.n
        });
    });

    // Sinh ra 5000 cây cối & 2000 tảng đá
    for(let i=0; i<5000; i++) {
        world.trees.push({
            x: Math.random() * MAP_SIZE,
            y: Math.random() * MAP_SIZE,
            r: 40 + Math.random() * 60,
            type: Math.random() > 0.3 ? 'pine' : 'oak'
        });
    }

    // Sinh ra 500 Yêu thú AI (Quái vật) rải rác
    for(let i=0; i<500; i++) {
        world.mobs.push({
            x: Math.random() * MAP_SIZE,
            y: Math.random() * MAP_SIZE,
            hp: 500, maxHp: 500,
            name: "YÊU THÚ CẤP 1",
            color: "#ff3344", isEnemy: true,
            vx: 0, vy: 0
        });
    }

    // Khởi tạo 150 Kỹ Năng
    for(let i=1; i<=150; i++) {
        player.skills.push({
            name: `Thần Thông Thứ ${i}`,
            mp: 20 + i*2, damage: 50 + i*5,
            unlocked: i === 1
        });
    }
}
    /**
 * PHẦN 3: VẬT LÝ & TRÍ TUỆ NHÂN TẠO
 */
function updatePhysics() {
    let currentSpeed = player.speed;
    // Sprint logic
    if (keys['shift'] && player.st > 5) {
        currentSpeed *= 2.3;
        player.st -= 1.8;
    } else {
        if (player.st < player.maxSt) player.st += 0.8;
    }

    // Di chuyển người chơi
    if(keys['w']) player.vy -= currentSpeed;
    if(keys['s']) player.vy += currentSpeed;
    if(keys['a']) player.vx -= currentSpeed;
    if(keys['d']) player.vx += currentSpeed;

    player.x += player.vx; player.y += player.vy;
    player.vx *= 0.88; player.vy *= 0.88;

    // Biên map
    player.x = Math.max(100, Math.min(MAP_SIZE-100, player.x));
    player.y = Math.max(100, Math.min(MAP_SIZE-100, player.y));

    // AI Yêu Thú: Tự tìm và đuổi theo người chơi trong tầm mắt
    world.mobs.forEach(m => {
        if (m.isEnemy) {
            let dx = player.x - m.x;
            let dy = player.y - m.y;
            let dist = Math.hypot(dx, dy);

            if (dist < 800) { // Tầm nhìn 800px
                m.vx += (dx / dist) * 0.2;
                m.vy += (dy / dist) * 0.2;
            } else {
                // Di chuyển ngẫu nhiên khi nhàn rỗi
                m.vx += (Math.random() - 0.5) * 0.1;
                m.vy += (Math.random() - 0.5) * 0.1;
            }
            m.x += m.vx; m.y += m.vy;
            m.vx *= 0.95; m.vy *= 0.95;

            // Va chạm với người chơi (Gây sát thương)
            if (dist < 40) {
                player.hp -= 0.5;
                player.vx += (dx/dist)*5; // Đẩy lùi
                player.vy += (dy/dist)*5;
            }
        }
    });

    // Va chạm với cây cối
    world.trees.forEach(t => {
        let dx = player.x - t.x;
        let dy = player.y - t.y;
        let dist = Math.hypot(dx, dy);
        if (dist < t.r) {
            player.x = t.x + (dx/dist)*t.r;
            player.y = t.y + (dy/dist)*t.r;
        }
    });

    // Camera Lerp siêu mượt
    camera.x += (player.x - camera.x) * camera.ease;
    camera.y += (player.y - camera.y) * camera.ease;
}
    /**
 * PHẦN 4: CHIẾN ĐẤU & THĂNG CẤP
 */
function castSkill() {
    if (player.mp < 50) {
        addLog("KHÔNG ĐỦ LINH LỰC!");
        return;
    }
    player.mp -= 50;
    addLog("SỬ DỤNG: THẦN THÔNG NHẤT KÍCH!");
    
    // Hiệu ứng hạt nổ tại vị trí người chơi
    for(let i=0; i<30; i++) {
        world.particles.push({
            x: player.x, y: player.y,
            vx: (Math.random() - 0.5) * 15,
            vy: (Math.random() - 0.5) * 15,
            life: 1.0, color: varToColor('--p')
        });
    }

    // Sát thương diện rộng cho quái vật xung quanh
    world.mobs.forEach((m, idx) => {
        if (m.isEnemy && Math.hypot(player.x - m.x, player.y - m.y) < 300) {
            m.hp -= 200;
            if (m.hp <= 0) {
                world.mobs.splice(idx, 1);
                gainExp(200);
                addLog("TIÊU DIỆT YÊU THÚ!");
            }
        }
    });
}

function gainExp(amount) {
    player.exp += amount;
    const realms = ["Luyện Khí", "Trúc Cơ", "Kết Đan", "Nguyên Anh", "Hóa Thần", "Luyện Hư", "Hợp Thể", "Đại Thừa", "Độ Kiếp", "Chí Tôn"];
    
    if (player.exp >= player.nextExp) {
        player.exp = 0;
        player.level++;
        player.nextExp *= 1.5;
        player.atk += 30;
        player.maxHp += 100;
        player.hp = player.maxHp;

        if (player.level % 10 === 0) {
            player.realmIdx++;
            addLog(`ĐỘT PHÁ CẢNH GIỚI: ${realms[player.realmIdx]}!`);
        } else {
            addLog(`THĂNG CẤP: ${player.level}`);
        }
    }
}

function addLog(msg) {
    const container = document.getElementById('log-container');
    const div = document.createElement('div');
    div.className = 'log-entry';
    div.innerText = `> ${msg}`;
    container.appendChild(div);
    if (container.children.length > 8) container.removeChild(container.firstChild);
    setTimeout(() => { if(div) div.style.opacity = '0'; }, 3000);
}
    /**
 * PHẦN 5: ENGINE ĐỒ HỌA & VÒNG LẶP CHÍNH
 */
function drawStickman(x, y, color, name, isPlayer = false) {
    const sx = x - camera.x + canvas.width/2;
    const sy = y - camera.y + canvas.height/2;

    if (sx < -200 || sx > canvas.width + 200 || sy < -200 || sy > canvas.height + 200) return;

    ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.lineCap = "round";
    const walk = isPlayer ? Math.sin(Date.now() * 0.015) * 15 : 0;

    // Vẽ Người Que Chi Tiết
    ctx.beginPath();
    ctx.arc(sx, sy - 40, 12, 0, Math.PI*2); // Đầu
    ctx.moveTo(sx, sy - 28); ctx.lineTo(sx, sy + 10); // Thân
    ctx.moveTo(sx, sy - 18); ctx.lineTo(sx - 25, sy + walk); // Tay L
    ctx.moveTo(sx, sy - 18); ctx.lineTo(sx + 25, sy - walk); // Tay R
    ctx.moveTo(sx, sy + 10); ctx.lineTo(sx - 18, sy + 45 + Math.abs(walk)); // Chân L
    ctx.moveTo(sx, sy + 10); ctx.lineTo(sx + 18, sy + 45 - Math.abs(walk)); // Chân R
    ctx.stroke();

    // Tên & Thanh máu NPC
    ctx.fillStyle = "white"; ctx.font = "bold 12px monospace"; ctx.textAlign = "center";
    ctx.fillText(name.toUpperCase(), sx, sy - 65);
}

function drawMinimap() {
    mmCtx.fillStyle = "black"; mmCtx.fillRect(0, 0, 260, 260);
    const s = 260 / MAP_SIZE;
    
    // Vẽ Tông Môn
    world.sects.forEach(sect => {
        mmCtx.fillStyle = sect.color;
        mmCtx.beginPath(); mmCtx.arc(sect.x*s, sect.y*s, 3, 0, Math.PI*2); mmCtx.fill();
    });

    // Vẽ Người Chơi (X-Ray)
    mmCtx.fillStyle = "#00f2ff";
    mmCtx.shadowBlur = 10; mmCtx.shadowColor = "#00f2ff";
    mmCtx.fillRect(player.x*s - 2, player.y*s - 2, 5, 5);
    mmCtx.shadowBlur = 0;
}

function render() {
    ctx.fillStyle = "#020205"; ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Vẽ Grid Ground
    ctx.strokeStyle = "#080812"; ctx.lineWidth = 1;
    const gSize = 400;
    for(let x = -camera.x % gSize; x < canvas.width; x += gSize) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
    }
    for(let y = -camera.y % gSize; y < canvas.height; y += gSize) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
    }

    // Vẽ Cây
    world.trees.forEach(t => {
        const tx = t.x - camera.x + canvas.width/2;
        const ty = t.y - camera.y + canvas.height/2;
        if (tx > -100 && tx < canvas.width + 100) {
            ctx.fillStyle = "#081508"; ctx.beginPath(); ctx.arc(tx, ty, t.r, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "#1a331a"; ctx.stroke();
        }
    });

    // Vẽ Yêu Thú & NPC
    world.mobs.forEach(m => drawStickman(m.x, m.y, m.color, m.name));
    drawStickman(player.x, player.y, "#00f2ff", player.name, true);

    // Vẽ Hạt Particles
    world.particles.forEach((p, i) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.02;
        if (p.life <= 0) world.particles.splice(i, 1);
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life;
        ctx.fillRect(p.x - camera.x + canvas.width/2, p.y - camera.y + canvas.height/2, 4, 4);
        ctx.globalAlpha = 1;
    });

    // Update UI
    const realms = ["Luyện Khí", "Trúc Cơ", "Kết Đan", "Nguyên Anh", "Hóa Thần", "Luyện Hư", "Hợp Thể", "Đại Thừa", "Độ Kiếp", "Chí Tôn"];
    document.getElementById('ui-realm').innerText = `${realms[player.realmIdx]} TẦNG ${player.level % 10 || 10}`;
    document.getElementById('hp-fill').style.width = (player.hp / player.maxHp * 100) + "%";
    document.getElementById('mp-fill').style.width = (player.mp / player.maxMp * 100) + "%";
    document.getElementById('st-fill').style.width = (player.st / player.maxSt * 100) + "%";
    document.getElementById('exp-fill').style.width = (player.exp / player.nextExp * 100) + "%";
    document.getElementById('coord-ui').innerText = `X: ${player.x.toFixed(0)} / Y: ${player.y.toFixed(0)}`;
    
    drawMinimap();
}

// Controls
window.onkeydown = (e) => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === 'q') castSkill();
    if (e.key === 'Tab') {
        e.preventDefault();
        const m = document.getElementById('tab-menu');
        m.style.display = m.style.display === 'grid' ? 'none' : 'grid';
    }
};
window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

function varToColor(v) { return "#00f2ff"; }

let last = 0;
function loop(t) {
    if (t - last >= FRAME_TIME) {
        updatePhysics();
        render();
        last = t;
    }
    requestAnimationFrame(loop);
}

initUniverse();
loop(0);
</script>
</body>
</html>
