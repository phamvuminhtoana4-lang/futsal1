<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>IMMORTAL SOUL: NO-BODY EDITION (244 FPS)</title>
    <style>
        :root { --p: #00f2ff; --a: #bc00ff; --bg: #000000; --card: rgba(15, 15, 25, 0.98); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Consolas', monospace; color: white; }
        canvas { display: block; position: absolute; z-index: 1; filter: contrast(1.2); }

        /* --- AUTH LAYER --- */
        #auth-layer { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--card); padding: 40px; border: 1px solid var(--p); border-radius: 4px; width: 400px; text-align: center; box-shadow: 0 0 40px rgba(0, 242, 255, 0.1); }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #050505; border: 1px solid #222; color: var(--p); outline: none; }
        .btn { width: 100%; padding: 15px; background: none; border: 1px solid var(--p); color: var(--p); cursor: pointer; text-transform: uppercase; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: var(--p); color: #000; box-shadow: 0 0 20px var(--p); }

        /* --- HUD (TOP LEFT) --- */
        #hud { position: absolute; top: 25px; left: 25px; z-index: 50; display: none; pointer-events: none; }
        .bar-container { width: 300px; height: 6px; background: rgba(255,255,255,0.05); margin-top: 10px; border-radius: 3px; }
        #hp-fill { height: 100%; background: #ff0055; width: 100%; transition: 0.1s; box-shadow: 0 0 10px #ff0055; }
        #mp-fill { height: 100%; background: #00f2ff; width: 100%; transition: 0.1s; box-shadow: 0 0 10px #00f2ff; }

        /* --- MENU TAB (TRANG BỊ & 150 SKILL) --- */
        #menu-tab { 
            position: fixed; inset: 40px; z-index: 90; background: rgba(0,0,0,0.95); 
            border: 1px solid #333; display: none; padding: 40px; grid-template-columns: 350px 1fr; gap: 40px;
        }
        .sect-title { color: var(--p); border-bottom: 1px solid var(--p); padding-bottom: 10px; margin-bottom: 20px; letter-spacing: 3px; }
        .slot { background: #0a0a0a; border: 1px solid #222; padding: 20px; margin-bottom: 15px; }
        .slot b { color: var(--a); }
        .skill-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; overflow-y: auto; max-height: 80vh; padding-right: 10px; }
        .skill-item { background: #050505; border: 1px solid #222; padding: 15px; font-size: 11px; text-align: center; position: relative; }
        .skill-item.learned { border-color: var(--p); color: var(--p); box-shadow: inset 0 0 10px rgba(0,242,255,0.1); }
        .skill-type { position: absolute; top: 2px; right: 5px; font-size: 8px; color: #444; }

        /* --- NOTIFICATION --- */
        #notif { position: fixed; bottom: 20px; right: 20px; z-index: 100; color: var(--p); font-size: 14px; text-align: right; }
    </style>
</head>
<body>

<div id="auth-layer">
    <div class="auth-card">
        <h2 style="color: var(--p); letter-spacing: 10px;">VÔ THÂN GIỚI</h2>
        <input type="text" id="username" placeholder="ĐẠO HIỆU...">
        <input type="password" id="password" placeholder="TÂM PHÁP MẬT MÃ...">
        <button class="btn" onclick="startMeditation()">BẮT ĐẦU NGỘ ĐẠO</button>
        <div style="font-size: 10px; color: #444; margin-top: 20px;">DI CHUYỂN: WASD | MENU: TAB | TẤN CÔNG: MOUSE1</div>
    </div>
</div>

<div id="hud">
    <div id="hud-name" style="font-size: 24px; font-weight: bold;">NAME</div>
    <div id="hud-sect" style="color: #666; font-size: 12px; margin-bottom: 10px;">TÔNG MÔN</div>
    <div class="bar-container"><div id="hp-fill"></div></div>
    <div class="bar-container"><div id="mp-fill"></div></div>
    <div id="coords" style="margin-top: 10px; font-size: 10px; color: #333;">X: 0, Y: 0</div>
</div>

<div id="menu-tab">
    <div id="inventory">
        <h2 class="sect-title">TÚI ĐỒ & GIÁP</h2>
        <div class="slot">MŨ: <b id="slot-helm">LINH QUANG MÃO</b></div>
        <div class="slot">GIÁP: <b id="slot-armor">THIÊN LAM GIÁP</b></div>
        <div class="slot">VŨ KHÍ: <b id="slot-weapon">THANH PHONG KIẾM</b></div>
        <div class="slot" style="font-size: 12px; line-height: 1.8;">
            <span style="color: #444;">CHỈ SỐ TỔNG:</span><br>
            CÔNG LỰC: <span id="stat-atk" style="color: var(--p);">0</span><br>
            PHÒNG NGỰ: <span id="stat-def" style="color: var(--p);">0</span><br>
            TỐC ĐỘ: <span id="stat-spd" style="color: var(--p);">0</span>
        </div>
    </div>
    <div id="skills">
        <h2 class="sect-title">15 THẦN THÔNG TÔNG MÔN</h2>
        <div class="skill-grid" id="skill-container"></div>
    </div>
</div>

<div id="notif"></div>
<canvas id="game"></canvas>

<script>
/**
 * PHẦN 1: CORE DATA ENGINE (150 SKILLS & ITEMS)
 */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// TỐI ƯU 244 FPS
const TARGET_FPS = 244;
const FRAME_TIME = 1000 / TARGET_FPS;
let lastFrame = 0, isRunning = false;

// TỔNG HỢP 10 TÔNG MÔN - 150 SKILL
const SECTS_DATA = [
    "Lôi Đình Phái", "Hỏa Vân Tông", "Huyền Thủy Cung", "Thần Mộc Gia", 
    "Sơn Thạch Bang", "Huyết Nguyệt Giáo", "Kiếm Tông", "Minh Giới", 
    "Tiên Đạo", "Ma Tộc"
];

const SKILL_MASTER = {};
SECTS_DATA.forEach(sName => {
    SKILL_MASTER[sName] = Array.from({length: 15}, (_, i) => ({
        id: i,
        name: `${sName.split(' ')[0]} - Chiêu ${i+1}`,
        type: i % 2 === 0 ? "TỰ NGỘ" : "NHIỆM VỤ",
        learned: false,
        manaReq: 50 + (i * 20),
        dmgMult: 1.5 + (i * 0.5)
    }));
});

// HỆ THỐNG TRANG BỊ
const ITEM_DB = {
    helms: { "LINH QUANG MÃO": { hp: 500, mp: 200 } },
    armors: { "THIÊN LAM GIÁP": { def: 100, spd: 1.5 } },
    weapons: { "THANH PHONG KIẾM": { atk: 300, range: 100 } }
};

let player = {
    name: "TOÀN PHỦI",
    sect: "Lôi Đình Phái",
    x: 0, y: 0,
    velX: 0, velY: 0,
    hp: 1000, maxHp: 1000,
    mp: 500, maxMp: 500,
    eq: { helm: "LINH QUANG MÃO", armor: "THIÊN LAM GIÁP", weapon: "THANH PHONG KIẾM" }
};

// Khởi tạo menu skill khi bắt đầu
function buildSkillMenu() {
    const container = document.getElementById('skill-container');
    container.innerHTML = SKILL_MASTER[player.sect].map(s => `
        <div class="skill-item ${s.learned ? 'learned' : ''}">
            <span class="skill-type">${s.type}</span>
            ${s.name}<br>
            <small style="color: #444">MP: ${s.manaReq}</small>
        </div>
    `).join('');
}

/**
 * PHẦN 2 & 3: LOGIC XỬ LÝ 244 FPS & TỰ NGỘ SKILL
 */
const keys = {};
const camera = { x: 0, y: 0 };
const slashEffects = [];

window.onkeydown = (e) => { 
    keys[e.key.toLowerCase()] = true; 
    if(e.key === 'Tab') {
        e.preventDefault();
        const m = document.getElementById('menu-tab');
        m.style.display = m.style.display === 'grid' ? 'none' : 'grid';
    }
};
window.onkeyup = (e) => keys[e.key.toLowerCase()] = false;

function startMeditation() {
    player.name = document.getElementById('username').value.toUpperCase() || "TOÀN PHỦI";
    document.getElementById('hud-name').innerText = player.name;
    document.getElementById('hud-sect').innerText = player.sect.toUpperCase();
    document.getElementById('auth-layer').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    buildSkillMenu();
    isRunning = true;
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    if(!isRunning) return;

    // Tốc độ dựa trên Giáp
    const spd = ITEM_DB.armors[player.eq.armor].spd;
    if(keys['w']) player.velY -= spd;
    if(keys['s']) player.velY += spd;
    if(keys['a']) player.velX -= spd;
    if(keys['d']) player.velX += spd;

    player.x += player.velX;
    player.y += player.velY;
    player.velX *= 0.92;
    player.velY *= 0.92;

    // Camera follow
    camera.x += (player.x - camera.x) * 0.1;
    camera.y += (player.y - camera.y) * 0.1;

    // LOGIC TỰ NGỘ SKILL (Khi di chuyển đạt vận tốc nhất định)
    if(Math.abs(player.velX) > 5 && Math.random() < 0.0005) {
        let sectSkills = SKILL_MASTER[player.sect];
        let available = sectSkills.filter(s => !s.learned && s.type === "TỰ NGỘ");
        if(available.length > 0) {
            available[0].learned = true;
            notify(`ĐỘT PHÁ: Bạn đã tự ngộ được [${available[0].name}]!`);
            buildSkillMenu();
        }
    }

    // NHIỆM VỤ TÔNG MÔN (Đạt tọa độ x > 5000)
    if(player.x > 5000 && Math.random() < 0.01) {
        let questSkill = SKILL_MASTER[player.sect].find(s => !s.learned && s.type === "NHIỆM VỤ");
        if(questSkill) {
            questSkill.learned = true;
            notify(`HOÀN THÀNH: Nhiệm vụ tông môn mở khóa [${questSkill.name}]!`);
            buildSkillMenu();
        }
    }

    document.getElementById('coords').innerText = `TỌA ĐỘ: X:${Math.floor(player.x)} Y:${Math.floor(player.y)}`;
}

function notify(msg) {
    const n = document.getElementById('notif');
    n.innerText = msg;
    setTimeout(() => n.innerText = "", 5000);
}/**
 * PHẦN 4 & 5: RENDERING HIỆU ỨNG KHÔNG NHÂN VẬT
 */
function render() {
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Vẽ bụi không gian (Thế chỗ cho Map)
    ctx.fillStyle = "#222";
    for(let i=0; i<100; i++) {
        let rx = (i * 500 - camera.x * 0.5) % canvas.width;
        if(rx < 0) rx += canvas.width;
        let ry = (i * 300 - camera.y * 0.5) % canvas.height;
        if(ry < 0) ry += canvas.height;
        ctx.fillRect(rx, ry, 1, 1);
    }

    const screenX = player.x - camera.x + canvas.width/2;
    const screenY = player.y - camera.y + canvas.height/2;

    // VẼ HÀO QUANG (THAY CHO NHÂN VẬT)
    const time = Date.now() * 0.002;
    ctx.save();
    ctx.shadowBlur = 20 + Math.sin(time) * 10;
    ctx.shadowColor = varToColor(player.sect);
    ctx.strokeStyle = varToColor(player.sect);
    ctx.lineWidth = 2;
    
    // Vòng tròn trung tâm (Linh hồn)
    ctx.beginPath();
    ctx.arc(screenX, screenY, 15, 0, Math.PI*2);
    ctx.stroke();

    // Các vòng quỹ đạo (Linh lực trang bị)
    for(let i=0; i<3; i++) {
        ctx.beginPath();
        ctx.ellipse(screenX, screenY, 30 + i*10, 10, time + i, 0, Math.PI*2);
        ctx.stroke();
    }
    ctx.restore();

    // Vẽ vệt chém kỹ năng (Slash VFX)
    slashEffects.forEach((s, i) => {
        s.life--;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.life / 2;
        ctx.beginPath();
        ctx.arc(screenX, screenY, 100, s.angle - 0.5, s.angle + 0.5);
        ctx.stroke();
        if(s.life <= 0) slashEffects.splice(i, 1);
    });
}

function varToColor(sect) {
    const colors = {
        "Lôi Đình Phái": "#00f2ff", "Hỏa Vân Tông": "#ff4400", "Huyền Thủy Cung": "#0044ff",
        "Thần Mộc Gia": "#00ff44", "Sơn Thạch Bang": "#884400", "Huyết Nguyệt Giáo": "#ff0044",
        "Kiếm Tông": "#ffffff", "Minh Giới": "#440088", "Tiên Đạo": "#ffff00", "Ma Tộc": "#bc00ff"
    };
    return colors[sect] || "#fff";
}

window.onmousedown = (e) => {
    if(!isRunning) return;
    const angle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2);
    slashEffects.push({ angle: angle, life: 30, color: varToColor(player.sect) });
};

function gameLoop(now) {
    if(!isRunning) return;
    if(now - lastFrame >= FRAME_TIME) {
        update();
        render();
        lastFrame = now;
    }
    requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
